<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YG Company | التقارير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#E4002B;
    --red-dark:#B30021;
    --paper:#F7F2F2;
    --white:#FFFFFF;
    --ink:#241416;
    --ink-soft:#6B5658;
    --hairline:#E6D6D8;
    --red-soft:#FBE1E6;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Tajawal',sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  .shell{
    min-height:100%;
    display:grid;
    grid-template-columns:minmax(300px,5fr) 7fr;
  }

  /* ===== Brand panel ===== */
  .brand{
    background:var(--red);
    color:var(--white);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:28px;
    padding:48px 32px;
    position:relative;
    overflow:hidden;
  }
  .brand::after{               /* dark base band */
    content:"";
    position:absolute;
    inset-inline:0;
    bottom:0;
    height:14px;
    background:var(--red-dark);
  }
  .brand img{
    width:min(300px,70%);
    height:auto;
    filter:brightness(0) invert(1);   /* makes the red logo white */
  }
  .brand p{
    font-family:'Cairo',sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:.02em;
    opacity:.92;
    direction:ltr;
  }

  /* ===== Menu ===== */
  .menu{
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:56px clamp(24px,6vw,88px);
    max-width:760px;
  }
  .menu h1{
    font-family:'Cairo',sans-serif;
    font-weight:800;
    font-size:clamp(28px,4vw,40px);
    line-height:1.2;
  }
  .menu .lead{
    margin-top:10px;
    font-size:17px;
    color:var(--ink-soft);
  }
  .actions{
    margin-top:36px;
    display:grid;
    gap:16px;
  }

  .action{
    display:grid;
    grid-template-columns:64px 1fr 24px;
    align-items:center;
    gap:20px;
    padding:22px 22px;
    background:var(--white);
    border:2px solid var(--hairline);
    border-radius:14px;
    color:inherit;
    text-decoration:none;
    transition:background-color .18s, border-color .18s, color .18s, transform .18s;
  }
  .action .icon{
    width:64px;height:64px;
    border-radius:12px;
    background:var(--red-soft);
    color:var(--red);
    display:grid;place-items:center;
    transition:background-color .18s, color .18s;
  }
  .action .icon svg{width:32px;height:32px;}
  .action h2{
    font-family:'Cairo',sans-serif;
    font-weight:700;
    font-size:21px;
    line-height:1.3;
  }
  .action p{
    margin-top:4px;
    font-size:15px;
    color:var(--ink-soft);
    line-height:1.6;
    transition:color .18s;
  }
  .action .arrow{
    width:24px;height:24px;
    color:var(--red);
    transition:transform .18s, color .18s;
  }

  .action:hover,
  .action:focus-visible{
    background:var(--red);
    border-color:var(--red);
    color:var(--white);
  }
  .action:hover p,
  .action:focus-visible p{color:rgba(255,255,255,.88);}
  .action:hover .icon,
  .action:focus-visible .icon{background:rgba(255,255,255,.18);color:var(--white);}
  .action:hover .arrow,
  .action:focus-visible .arrow{color:var(--white);transform:translateX(-6px);}
  .action:focus-visible{outline:3px solid var(--ink);outline-offset:3px;}
  .action:active{transform:scale(.99);}

  /* ===== Mobile ===== */
  @media (max-width:820px){
    .shell{grid-template-columns:1fr;grid-template-rows:auto 1fr;}
    .brand{padding:32px 24px 40px;gap:14px;}
    .brand img{width:min(190px,55%);}
    .menu{padding:32px 20px 48px;max-width:none;justify-content:flex-start;}
    .action{grid-template-columns:52px 1fr 20px;gap:14px;padding:18px 16px;}
    .action .icon{width:52px;height:52px;}
    .action .icon svg{width:26px;height:26px;}
    .action h2{font-size:18px;}
    .action p{font-size:14px;}
  }
  @media (prefers-reduced-motion:reduce){
    .action,.action *{transition:none !important;}
  }
</style>
</head>
